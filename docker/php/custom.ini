[PHP]
memory_limit = 256M
; Gambar program boleh sampai 4 MB (validasi max:4096), foto user 2 MB; default PHP image hanya 2M
upload_max_filesize = 8M
post_max_size = 16M
max_execution_time = 300
max_input_time = 300
date.timezone = UTC
default_charset = UTF-8
expose_php = Off

; Local development diagnostics. Laravel APP_DEBUG remains the application-level control.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

[Session]
session.use_strict_mode = 1

[OPcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
