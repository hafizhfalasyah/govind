name: govind

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GOVIND_APP_PORT:-8083}:80"
    environment:
      APP_NAME: ${GOVIND_APP_NAME:-Laravel}
      APP_ENV: ${GOVIND_APP_ENV:-local}
      APP_KEY: ${GOVIND_APP_KEY}
      APP_DEBUG: ${GOVIND_APP_DEBUG:-true}
      APP_URL: ${GOVIND_APP_URL:-http://localhost:8083}

      LOG_CHANNEL: ${GOVIND_LOG_CHANNEL:-stack}
      LOG_LEVEL: ${GOVIND_LOG_LEVEL:-debug}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${GOVIND_DB_DATABASE:-govind}
      DB_USERNAME: ${GOVIND_DB_USERNAME:-govind}
      DB_PASSWORD: ${GOVIND_DB_PASSWORD:-change-me}

      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database

      MAIL_MAILER: smtp
      MAIL_SCHEME: null
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_FROM_ADDRESS: ${GOVIND_MAIL_FROM_ADDRESS:-noreply@govind.local}
      MAIL_FROM_NAME: ${GOVIND_MAIL_FROM_NAME:-Govind Abra Enterprise}

      COMPOSER_CACHE_DIR: /tmp/composer-cache
    volumes:
      - ./:/var/www/html
      - govind-composer-cache:/tmp/composer-cache
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - govind-network

  db:
    # Produksi (cPanel) memakai MariaDB 10.6; versi lokal disamakan
    image: mariadb:10.6.27
    restart: unless-stopped
    ports:
      # Hanya dari komputer ini (127.0.0.1), agar `php artisan serve` native (PHP 8.5) bisa memakai database ini.
      # 3306 biasanya dipakai XAMPP, 3307 dipakai stack RRCONS.
      - "127.0.0.1:${GOVIND_DB_PORT:-3308}:3306"
    environment:
      MARIADB_DATABASE: ${GOVIND_DB_DATABASE:-govind}
      MARIADB_USER: ${GOVIND_DB_USERNAME:-govind}
      MARIADB_PASSWORD: ${GOVIND_DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${GOVIND_DB_ROOT_PASSWORD:-change-root-me}
    volumes:
      - govind-db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - govind-network

  # Tidak ada service node: halaman memakai Tailwind/Alpine dari CDN dan tidak memakai Vite,
  # jadi tidak ada aset yang perlu di-compile.

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${GOVIND_MAILPIT_SMTP_PORT:-1026}:1025"
      - "${GOVIND_MAILPIT_UI_PORT:-8026}:8025"
    networks:
      - govind-network

volumes:
  govind-db-data:
  govind-composer-cache:

networks:
  govind-network:
    driver: bridge
